<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Circuit Quest</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e1a;
        font-family: system-ui, sans-serif;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #game-container canvas {
        display: block;
        margin: 0 auto;
      }
      #auth-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(6, 10, 24, 0.92);
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        color: #e8f0ff;
      }
      #auth-overlay.visible { display: flex; }
      .auth-card {
        background: linear-gradient(160deg, #152238, #0d1628);
        border: 1px solid #3a6ea5;
        border-radius: 16px;
        padding: 28px 32px;
        width: min(380px, 92vw);
        box-shadow: 0 12px 40px rgba(0, 80, 200, 0.35);
      }
      .auth-card h2 { margin: 0 0 8px; color: #5ce1ff; letter-spacing: 0.04em; }
      .auth-card p { margin: 0 0 16px; color: #9bb4d0; font-size: 0.9rem; }
      .auth-card label { display: block; font-size: 0.8rem; color: #7aa0c4; margin-bottom: 4px; }
      .auth-card input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #2a4a70;
        background: #0a1220;
        color: #e8f0ff;
        font-size: 1rem;
      }
      .auth-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .auth-actions button {
        flex: 1;
        min-width: 100px;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .btn-primary { background: #1e90ff; color: #fff; }
      .btn-secondary { background: #243652; color: #cde; }
      .btn-google { background: #fff; color: #222; }
      .btn-guest { background: #2a5a3a; color: #dfffe8; }
      .auth-error { color: #ff7b7b; font-size: 0.85rem; min-height: 1.2em; margin-bottom: 8px; }
      .auth-banner {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 900;
        background: #5a3a10;
        color: #ffe8b0;
        text-align: center;
        padding: 8px 12px;
        font-size: 0.85rem;
      }
      .auth-banner.visible { display: block; }
    </style>
    <script type="module" crossorigin src="./assets/index-NS07ojz-.js"></script>
  </head>
  <body>
    <div id="auth-banner" class="auth-banner">
      Guest mode — Firebase not configured. Progress saves locally only.
    </div>
    <div id="game-container"></div>
    <div id="auth-overlay">
      <div class="auth-card">
        <h2>Circuit Quest Login</h2>
        <p>Sign in to sync progress, or continue as guest.</p>
        <div class="auth-error" id="auth-error"></div>
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" />
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" placeholder="••••••••" />
        <div class="auth-actions">
          <button class="btn-primary" id="auth-signin">Sign In</button>
          <button class="btn-secondary" id="auth-signup">Create Account</button>
        </div>
        <div class="auth-actions" style="margin-top:12px">
          <button class="btn-google" id="auth-google">Google</button>
          <button class="btn-guest" id="auth-guest">Play as Guest</button>
        </div>
        <div class="auth-actions" style="margin-top:12px">
          <button class="btn-secondary" id="auth-close">Back</button>
        </div>
      </div>
    </div>
  </body>
</html>
